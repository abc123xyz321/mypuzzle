<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authentication</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 20px;
    overflow: hidden;
    touch-action: none;
}

.container {
    max-width: 500px;
    margin: auto;
    background-color: #fff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    text-align: center;
}

button {
    padding: 15px 25px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 10px 0;
    background-color: #007BFF;
    color: white;
    transition: background-color 0.2s;
}

button:hover {
    background-color: #0056b3;
}

button:disabled {
    opacity: 0.6;
    cursor: default;
}

.submit-btn {
    background-color: #28a745;
}

.submit-btn:hover {
    background-color: #218838;
}

#authScreen {
    display: none;
}

#submitBtn {
    position: fixed;
    bottom: 20px;
    left: 20px;
}

#placeholderText {
    position: fixed;
    bottom: 30px;
    left: 180px;
    display: none;
    font-family: "Courier New", monospace;
}

#hotColdText {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-weight: bold;
    font-size: 18px;
    transition: font-size 0.2s ease;
}

#timer {
    position: fixed;
    top: 20px;
    left: 20px;
    font-size: 18px;
    font-weight: bold;
}

#hiddenBtn {
    position: absolute;
    width: 40px;
    height: 40px;
    background: transparent;
    border: none;
    opacity: 0;
    cursor: pointer;
}

#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.7);
    color: white;
    font-size: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 9999;
    display: none;
}

@keyframes shake {
    0% { transform: translateX(-50%) translate(0, 0); }
    10% { transform: translateX(-50%) translate(-5px, -5px); }
    20% { transform: translateX(-50%) translate(5px, 5px); }
    30% { transform: translateX(-50%) translate(-5px, 5px); }
    40% { transform: translateX(-50%) translate(5px, -5px); }
    50% { transform: translateX(-50%) translate(-5px, -5px); }
    60% { transform: translateX(-50%) translate(5px, 5px); }
    70% { transform: translateX(-50%) translate(-5px, 5px); }
    80% { transform: translateX(-50%) translate(5px, -5px); }
    90% { transform: translateX(-50%) translate(-5px, -5px); }
    100% { transform: translateX(-50%) translate(0, 0); }
}

.shake {
    animation: shake 0.2s infinite;
}

#magnifier {
    position: fixed;
    font-size: 32px;
    user-select: none;
    cursor: grab;
    z-index: 1000;
}
</style>
</head>

<body>

<div class="container" id="startScreen">
    <h1>Authentication</h1>
    <button id="startBtn">Start</button>
</div>

<div id="authScreen">
    <div id="hotColdText">Frozen</div>
    <div id="timer">Time left: 15s</div>

    <button id="submitBtn" class="submit-btn" disabled>Submit</button>
    <div id="placeholderText">redhouse49</div>

    <button id="hiddenBtn"></button>
</div>

<div id="overlay">Time's up! You must refresh the page to try again.</div>

<div id="magnifier" style="display:none;">🔎</div>

<script>
const startBtn = document.getElementById("startBtn");
const startScreen = document.getElementById("startScreen");
const authScreen = document.getElementById("authScreen");

const hiddenBtn = document.getElementById("hiddenBtn");
const submitBtn = document.getElementById("submitBtn");
const placeholderText = document.getElementById("placeholderText");
const hotColdText = document.getElementById("hotColdText");
const timerDisplay = document.getElementById("timer");
const overlay = document.getElementById("overlay");
const magnifier = document.getElementById("magnifier");

let timeLeft = 15;
let timerInterval;
let isMobile = false;

// Detect mobile
function checkMobile() {
    return /Mobi|Android/i.test(navigator.userAgent);
}

startBtn.addEventListener("click", () => {
    startScreen.style.display = "none";
    authScreen.style.display = "block";
    isMobile = checkMobile();

    if (isMobile) {
        magnifier.style.left = window.innerWidth/2 - 16 + "px";
        magnifier.style.top = window.innerHeight/2 - 16 + "px";
        magnifier.style.display = "block";
        enableMagnifierDrag();
    }

    spawnHiddenButton();
    startTimer();
});

function startTimer() {
    timerDisplay.textContent = `Time left: ${timeLeft}s`;
    timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = `Time left: ${timeLeft}s`;

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            overlay.style.display = "flex";
            authScreen.style.pointerEvents = "none";
        }
    }, 1000);
}

function spawnHiddenButton() {
    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;

    // Reference desktop: 1920px width -> 40px button
    const referenceWidth = 1920;
    const referenceButtonSize = 40;
    const buttonSize = Math.max(24, referenceButtonSize * (screenWidth / referenceWidth)); // minimum 24px

    hiddenBtn.style.width = buttonSize + "px";
    hiddenBtn.style.height = buttonSize + "px";

    // Avoid bottom-left submit button
    const padding = 60;
    const avoidX = 220; // approx submit + padding
    const avoidY = 120;

    let x, y;
    do {
        x = Math.random() * (screenWidth - padding - buttonSize);
        y = Math.random() * (screenHeight - padding - buttonSize);
    } while (x < avoidX && y > screenHeight - avoidY);

    hiddenBtn.style.left = `${x}px`;
    hiddenBtn.style.top = `${y}px`;
}

// calculate hot/cold text and handle submit button on mobile
function updateProximity(x, y) {
    const rect = hiddenBtn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const dx = x - cx;
    const dy = y - cy;
    const distance = Math.sqrt(dx*dx + dy*dy);

    let text = "Frozen";
    let fontSize = 18;
    hotColdText.classList.remove("shake");

    if (distance < 40) { text = "Boiling"; fontSize = 60; hotColdText.classList.add("shake"); }
    else if (distance < 80) { text = "Hot"; fontSize = 50; }
    else if (distance < 140) { text = "Warm"; fontSize = 40; }
    else if (distance < 220) { text = "Lukewarm"; fontSize = 30; }
    else if (distance < 320) { text = "Cold"; fontSize = 24; }

    hotColdText.textContent = text;
    hotColdText.style.fontSize = fontSize + "px";

    // Mobile: submit only when overlapping
    if (isMobile) {
        const magRect = magnifier.getBoundingClientRect();
        if (!(magRect.right < rect.left || magRect.left > rect.right ||
              magRect.bottom < rect.top || magRect.top > rect.bottom)) {
            submitBtn.disabled = false;
        } else {
            submitBtn.disabled = true;
        }
    }
}

// Desktop cursor
document.addEventListener("mousemove", (e) => {
    if (!isMobile) updateProximity(e.clientX, e.clientY);
});

// Mobile draggable magnifier
function enableMagnifierDrag() {
    let offsetX = 0, offsetY = 0, dragging = false;

    magnifier.addEventListener("touchstart", e => {
        dragging = true;
        const touch = e.touches[0];
        offsetX = touch.clientX - magnifier.offsetLeft;
        offsetY = touch.clientY - magnifier.offsetTop;
    });

    magnifier.addEventListener("touchmove", e => {
        if (!dragging) return;
        e.preventDefault();
        const touch = e.touches[0];
        magnifier.style.left = touch.clientX - offsetX + "px";
        magnifier.style.top = touch.clientY - offsetY + "px";
        const centerX = touch.clientX - offsetX + 16;
        const centerY = touch.clientY - offsetY + 16;
        updateProximity(centerX, centerY);
    });

    magnifier.addEventListener("touchend", e => { dragging = false; });
}

// Desktop: hidden button click
hiddenBtn.addEventListener("click", () => {
    if (!isMobile) {
        submitBtn.disabled = false;
        hiddenBtn.style.display = "none";
        hotColdText.textContent = "Unlocked";
        hotColdText.style.fontSize = "24px";
        hotColdText.classList.remove("shake");

        // Stop the timer
        clearInterval(timerInterval);
    }
});


// Submit click
submitBtn.addEventListener("click", () => {
    placeholderText.style.display = "block";
});
</script>

</body>
</html>
