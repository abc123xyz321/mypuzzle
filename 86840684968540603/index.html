<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authentication</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; overflow: hidden; font-family: Arial, sans-serif; background: #f5f5f5; }
    .container { max-width: 500px; margin: auto; padding: 30px; text-align: center; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, .1); }
    button { padding: 15px 25px; border: 0; border-radius: 8px; cursor: pointer; font-size: 16px; color: #fff; background: #007bff; }
    button:hover:not(:disabled) { background: #0056b3; }
    button:disabled { cursor: default; opacity: .6; }
    .submit-btn { background: #28a745; }
    .submit-btn:hover:not(:disabled) { background: #218838; }
    #gameScreen { display: none; }
    #timer { position: fixed; top: 20px; left: 20px; font-size: 18px; font-weight: bold; }
    #challenge { position: fixed; inset: 0; display: grid; place-items: center; padding: 80px 20px 110px; }
    #tracePanel { width: min(460px, 100%); padding: 22px; text-align: center; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, .1); }
    #traceCanvas { display: block; width: min(360px, 100%); aspect-ratio: 1; margin: 16px auto 10px; border-radius: 50%; cursor: crosshair; touch-action: none; }
    #accuracy { min-height: 20px; font-weight: bold; }
    #hint { margin: 8px 0 0; color: #555; font-size: 14px; }
    #submitBtn { position: fixed; bottom: 20px; left: 20px; }
    #placeholderText { position: fixed; bottom: 30px; left: 180px; display: none; font-family: "Courier New", monospace; }
    #overlay { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; color: #fff; background: rgba(0, 0, 0, .7); font-size: 24px; }
    @media (max-width: 520px) { body { padding: 12px; } #timer { top: 12px; left: 12px; } #submitBtn { bottom: 12px; left: 12px; } #placeholderText { bottom: 22px; left: 155px; } #tracePanel { padding: 18px; } }
  </style>
</head>
<body>
  <div class="container" id="startScreen"><h1>Authentication</h1><button id="startBtn">Start</button></div>
  <div id="gameScreen">
    <div id="timer">Time left: 60s</div>
    <div id="challenge"><div id="tracePanel">
      <strong>Trace the circle exactly</strong>
      <canvas id="traceCanvas" width="720" height="720" aria-label="Circle tracing challenge"></canvas>
      <div id="accuracy">Accuracy: 0% — 95% required</div>
      <p id="hint">Click and hold to trace the outline. On mobile, press and hold.</p>
    </div></div>
    <button id="submitBtn" class="submit-btn" disabled>Submit</button>
    <div id="placeholderText">silverroom23</div>
  </div>
  <div id="overlay">Time's up! Refresh to try again.</div>
  <script>
    const startBtn = document.getElementById('startBtn'), startScreen = document.getElementById('startScreen'), gameScreen = document.getElementById('gameScreen');
    const canvas = document.getElementById('traceCanvas'), ctx = canvas.getContext('2d'), accuracyDisplay = document.getElementById('accuracy');
    const submitBtn = document.getElementById('submitBtn'), placeholderText = document.getElementById('placeholderText'), timerDisplay = document.getElementById('timer'), overlay = document.getElementById('overlay');
    const SIZE = canvas.width, center = SIZE / 2, radius = 250, tolerance = 16, bins = 360;
    let covered = new Set(), drawing = false, lastPoint = null, timeLeft = 60, gameOver = false, timer;

    function drawGuide() {
      ctx.clearRect(0, 0, SIZE, SIZE); ctx.beginPath(); ctx.arc(center, center, radius, 0, Math.PI * 2);
      ctx.lineWidth = 7; ctx.strokeStyle = '#555'; ctx.setLineDash([18, 12]); ctx.lineCap = 'round'; ctx.stroke(); ctx.setLineDash([]);
    }
    function pointFromEvent(event) {
      const box = canvas.getBoundingClientRect();
      return { x: (event.clientX - box.left) * SIZE / box.width, y: (event.clientY - box.top) * SIZE / box.height };
    }
    function markPoint(point) {
      const dx = point.x - center, dy = point.y - center, distance = Math.hypot(dx, dy);
      if (Math.abs(distance - radius) > tolerance) return;
      const index = Math.floor(((Math.atan2(dy, dx) + Math.PI * 2) % (Math.PI * 2)) / (Math.PI * 2) * bins);
      for (let offset = -2; offset <= 2; offset++) covered.add((index + offset + bins) % bins);
    }
    function drawStroke(from, to) {
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.strokeStyle = '#007bff'; ctx.stroke();
      const distance = Math.hypot(to.x - from.x, to.y - from.y), steps = Math.max(1, Math.ceil(distance / 3));
      for (let i = 0; i <= steps; i++) markPoint({ x: from.x + (to.x - from.x) * i / steps, y: from.y + (to.y - from.y) * i / steps });
    }
    function updateAccuracy() {
      const accuracy = Math.floor(covered.size / bins * 100);
      accuracyDisplay.textContent = `Accuracy: ${accuracy}% — 95% required`;
      submitBtn.disabled = accuracy < 95 || gameOver;
    }
    function beginTrace(event) {
      if (gameOver || (event.button !== undefined && event.button !== 0)) return;
      event.preventDefault(); drawing = true; lastPoint = pointFromEvent(event); canvas.setPointerCapture?.(event.pointerId); markPoint(lastPoint); updateAccuracy();
    }
    function continueTrace(event) {
      if (!drawing || gameOver) return;
      event.preventDefault(); const point = pointFromEvent(event); drawStroke(lastPoint, point); lastPoint = point; updateAccuracy();
    }
    function endTrace(event) { if (!drawing) return; drawing = false; canvas.releasePointerCapture?.(event.pointerId); lastPoint = null; }
    function startTimer() {
      timerDisplay.textContent = `Time left: ${timeLeft}s`;
      timer = setInterval(() => { timeLeft--; timerDisplay.textContent = `Time left: ${timeLeft}s`; if (timeLeft <= 0) { clearInterval(timer); gameOver = true; drawing = false; submitBtn.disabled = true; overlay.style.display = 'flex'; } }, 1000);
    }
    startBtn.addEventListener('click', () => { startScreen.style.display = 'none'; gameScreen.style.display = 'block'; drawGuide(); startTimer(); });
    canvas.addEventListener('pointerdown', beginTrace); canvas.addEventListener('pointermove', continueTrace); canvas.addEventListener('pointerup', endTrace); canvas.addEventListener('pointercancel', endTrace);
    submitBtn.addEventListener('click', () => { placeholderText.style.display = 'block'; });
  </script>
</body>
</html>
