<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yay happy fun surprise :)))))</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Comic Sans MS", "Comic Sans", cursive;
    }

    /* Initial prompt */
    #prompt {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      font-size: 3em;
      text-align: center;
      cursor: pointer;
      background-color: white;
    }

    /* Fullscreen surprise */
    #surprise {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://image.petmd.com/files/petmd-kitten-facts.jpg') no-repeat center center;
      background-size: cover;
      z-index: 10;
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>
  <div id="prompt">Click for a surprise ;)</div>
  <div id="surprise"></div>
  <audio id="audio" loop>
    <source src="https://www.dropbox.com/scl/fi/xz7wkncbcb4lhlbkp2smf/sound.mp3?rlkey=h6usttfvt36qukx0l3owdzyv7&st=apvuksv6&raw=1" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

<script>
  const prompt = document.getElementById('prompt');
  const surprise = document.getElementById('surprise');
  const audio = document.getElementById('audio');

  // Asset URLs
  const IMAGE_2 =
    "https://www.dropbox.com/scl/fi/rwuj57f13ovlxje51yzzo/1987.png?rlkey=5t9tbrvfgx7z1xnu2y52wkwn5&st=hdj9odhp&raw=1";
  const AUDIO_2 =
    "https://www.dropbox.com/scl/fi/y89962hn8y9ljulpt8yjq/scream.mp3?rlkey=d64wmlumpnfte9r92x1v99r52&st=7qrkp1wm&raw=1";

  // Preload secondary image
  const imgCache = new Image();
  imgCache.src = IMAGE_2;

  // Preload secondary audio
  const audio2 = new Audio(AUDIO_2);
  audio2.preload = "auto";

  function isMobile() {
    return /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  }

  if (isMobile()) {
    prompt.textContent = "Tap for a surprise ;)";
  }

  prompt.addEventListener('click', () => {
    prompt.style.display = 'none';
    surprise.style.display = 'block';

    audio.play().catch(() => {});

    // Start monitoring input after delay
    setTimeout(() => {

      const func1 = () => {
        // Stop initial audio
        audio.pause();
        audio.currentTime = 0;

        // Swap background image
        surprise.style.backgroundImage = `url('${IMAGE_2}')`;

        // Play secondary audio once
        audio2.currentTime = 0;
        audio2.play().catch(() => {});

        // Remove listeners
        document.removeEventListener('mousemove', func1);
        document.removeEventListener('mousedown', func1);
        document.removeEventListener('touchstart', func1);
        document.removeEventListener('keydown', func1);
      };

      document.addEventListener('mousemove', func1);
      document.addEventListener('mousedown', func1);
      document.addEventListener('touchstart', func1);
      document.addEventListener('keydown', func1);

    }, 5000);

  }, { once: true });
</script>

</body>
</html>
