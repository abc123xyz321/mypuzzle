<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authentication</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 20px;
    }
    .container {
        max-width: 500px;
        margin: auto;
        background-color: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        text-align: center;
    }
    button {
        padding: 15px 30px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    #authBtn {
        background-color: #007BFF;
        color: white;
    }
    #authBtn:hover {
        background-color: #0056b3;
    }
    #skipBtn {
        background-color: #dc3545;
        color: white;
        margin-top: 20px;
        display: none;
    }
    #skipBtn:hover {
        background-color: #b52a37;
    }
    #message {
        margin-top: 20px;
        font-size: 16px;
        font-family: 'Courier New', monospace;
        display: none;
        color: #333;
    }
    #timer {
        margin-top: 10px;
        font-size: 14px;
        display: none;
        color: #555;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Authentication</h1>

    <button id="authBtn">Authenticate</button>
    <button id="skipBtn">Skip authentication wait</button>

    <div id="message"></div>
    <div id="timer"></div>
</div>

<script>
    const authBtn = document.getElementById("authBtn");
    const skipBtn = document.getElementById("skipBtn");
    const message = document.getElementById("message");
    const timerDisplay = document.getElementById("timer");

    let timeLeft = 30;
    let elapsed = 0;
    let countdown;

    authBtn.addEventListener("click", () => {
        authBtn.disabled = true;
        skipBtn.style.display = "none";

        timeLeft = 30;
        elapsed = 0;

        message.style.display = "block";
        timerDisplay.style.display = "block";

        message.textContent = "Authentication sequence initialized...";
        timerDisplay.textContent = `Estimated time remaining: ${timeLeft}s`;

        countdown = setInterval(() => {
            timeLeft--;
            elapsed++;

            // Show skip button after 10 seconds
            if (elapsed === 10) {
                skipBtn.style.display = "inline-block";
            }

            // Every 10 seconds, 50% chance to add 5–20 seconds
            if (elapsed % 10 === 0) {
                if (Math.random() < 0.5) {
                    const added = Math.floor(Math.random() * 16) + 5;
                    timeLeft += added;
                }
            }

            timerDisplay.textContent = `Estimated time remaining: ${timeLeft}s`;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.style.display = "none";
                message.textContent = "orangecomputer17";
                authBtn.disabled = false;
                skipBtn.style.display = "none";
            }
        }, 1000);
    });

    skipBtn.addEventListener("click", () => {
        window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ";
    });
</script>

</body>
</html>
