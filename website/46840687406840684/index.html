<html lang="en">

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;

}
.container {
    max-width: 500px;
    margin: auto;
    background-color: #fff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    text-align: center;
}
button {
    padding: 15px 25px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 10px 0;
    background-color: #007BFF;
    color: white;
    transition: background-color 0.2s;
}
button:hover {
    background-color: #0056b3;
}
button:disabled {
    opacity: 0.7;
    cursor: default;
}
input {
    padding: 12px;
    font-size: 16px;
    width: 80%;
    margin: 15px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}
.submit-btn {
    background-color: #28a745;
}
.submit-btn:hover {
    background-color: #218838;
}
#timer {
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
}
#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.7);
    color: white;
    font-size: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 9999;
    display: none;
}
#scoreDisplay {
    font-size: 18px;
    font-weight: bold;
    margin-top: 15px;
}
#completionMessage {
    display: none;
    margin-top: 20px;
    font-size: 16px;
    font-family: 'Courier New', monospace;
}
</style>
</head>
<body>
<div class="container">
    <h1>Authentication</h1>
    <div id="startContainer">
        <button id="startBtn">Start</button>
    </div>

    <div id="quizContainer" style="display:none;">
        <p id="instruction">Listen to the word, then type the word</p>
        <button id="speakBtn">Speak</button>
        <input type="text" id="userInput" placeholder="Type the word here">
        <button id="submitBtn" class="submit-btn" disabled>Submit</button>
        <p id="timer">Time left: 12s</p>
        <p id="scoreDisplay">0/3 correct</p>
        <p id="completionMessage">whitebox34</p>
    </div>
</div>

<div id="overlay">Time's up! You must refresh the page to try again.</div>

<script>
const easyWords = [
    "apple",
    "banana",
    "orange",
    "grape",
    "cherry",
    "tomato",
    "cucumber",
    "watermelon",
    "pumpkin",
    "pear"
];

const hardWords = [
    "onomatopoeia",
    "supercalifragilisticexpialidocious",
    "antidisestablishmentarianism",
    "floccinaucinihilipilification",
    "honorificabilitudinitatibus",
    "deinstitutionalization",
    "pneumonoultramicroscopicsilicovolcanoconiosis",
    "hippopotomonstrosesquippedaliophobia",
    "Pseudopseudohypoparathyroidism",
    "electroencephalographically"
];

let currentWord = "";
let timer;
let timeLeft = 12;
let correctCount = 0;

const startBtn = document.getElementById("startBtn");
const startContainer = document.getElementById("startContainer");
const quizContainer = document.getElementById("quizContainer");
const speakBtn = document.getElementById("speakBtn");
const userInput = document.getElementById("userInput");
const submitBtn = document.getElementById("submitBtn");
const timerDisplay = document.getElementById("timer");
const overlay = document.getElementById("overlay");
const scoreDisplay = document.getElementById("scoreDisplay");
const completionMessage = document.getElementById("completionMessage");

function pickRandomWord() {
    // First two correct answers → easy words
    if (correctCount < 2) {
        const randomIndex = Math.floor(Math.random() * easyWords.length);
        return easyWords[randomIndex];
    }
    // Third word → hard words
    else {
        const randomIndex = Math.floor(Math.random() * hardWords.length);
        return hardWords[randomIndex];
    }
}


function speakWord(word) {
    const utterance = new SpeechSynthesisUtterance(word);
    speechSynthesis.speak(utterance);
}

// Start quiz
startBtn.addEventListener("click", () => {
    startContainer.style.display = "none";
    quizContainer.style.display = "block";
    nextWord();
});

// Handle speaking
speakBtn.addEventListener("click", () => {
    if(currentWord) speakWord(currentWord);
});

// Enable submit if input matches word
userInput.addEventListener("input", () => {
    submitBtn.disabled = !(userInput.value.trim().toLowerCase() === currentWord.toLowerCase());
});

// Submit word
submitBtn.addEventListener("click", () => {
    correctCount++;
    scoreDisplay.textContent = `${correctCount}/3 correct`;
    clearInterval(timer); // stop countdown
    userInput.value = "";
    submitBtn.disabled = true;

    if(correctCount >= 3) {
        // Quiz completed
        completionMessage.style.display = "block";
    } else {
        // Next word after short delay
        setTimeout(nextWord, 100);
    }
});

// Pick next word and reset timer
function nextWord() {
    currentWord = pickRandomWord();
    speakWord(currentWord);
    timeLeft = 12;
    timerDisplay.textContent = `Time left: ${timeLeft}s`;
    timer = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = `Time left: ${timeLeft}s`;
        if(timeLeft <= 0) {
            clearInterval(timer);
            overlay.style.display = "flex";
            quizContainer.style.pointerEvents = "none";
        }
    }, 1000);
}
</script>
