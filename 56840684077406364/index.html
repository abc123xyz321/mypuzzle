<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Authentication</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    background-color: #fff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    text-align: center;
}

button {
    padding: 15px 25px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 10px 5px;
    background-color: #007BFF;
    color: white;
    transition: background-color 0.2s;
}

button:hover {
    background-color: #0056b3;
}

button:disabled {
    opacity: 0.6;
    cursor: default;
}

.submit-btn {
    background-color: #28a745;
}

.submit-btn:hover {
    background-color: #218838;
}

.color-box {
    width: 100%;
    height: 120px;
    border-radius: 8px;
    margin: 15px 0;
    border: 1px solid #ccc;
}

.slider-group {
    text-align: left;
    margin-top: 15px;
}

.feedback {
    font-size: 13px;
    font-weight: bold;
    margin-top: 3px;
    display: none;
}

.more { color: #dc3545; }
.less { color: #fd7e14; }
.perfect { color: #28a745; }

.slider-group input[type="range"] {
    width: 100%;
}

.slider-group input[type="range"]:disabled {
    opacity: 0.5;
}

.hint-section {
    margin-top: 20px;
}

.hint-count {
    font-size: 14px;
    margin-top: 5px;
}

#completionMessage {
    display: none;
    margin-top: 20px;
    font-size: 16px;
    font-family: 'Courier New', monospace;
}
</style>
</head>

<body>
<div class="container">
    <h1>Authentication</h1>

    <button id="generateColorBtn">Generate Color</button>

    <div id="targetColor" class="color-box"></div>
    <div id="userColor" class="color-box"></div>

    <div class="slider-group">
        <label>Red: <span id="redValue">0</span></label>
        <input type="range" id="redSlider" min="0" max="255" value="0" disabled>
        <div id="redFeedback" class="feedback"></div>
    </div>

    <div class="slider-group">
        <label>Green: <span id="greenValue">0</span></label>
        <input type="range" id="greenSlider" min="0" max="255" value="0" disabled>
        <div id="greenFeedback" class="feedback"></div>
    </div>

    <div class="slider-group">
        <label>Blue: <span id="blueValue">0</span></label>
        <input type="range" id="blueSlider" min="0" max="255" value="0" disabled>
        <div id="blueFeedback" class="feedback"></div>
    </div>

    <div class="hint-section">
        <button id="hintBtn" disabled>Hint</button>
        <div id="hintCount" class="hint-count">6 remaining</div>
    </div>

    <button id="submitBtn" class="submit-btn" disabled>Submit</button>

    <p id="completionMessage">tealrock97</p>
</div>

<script>
let targetRGB = null;
let hintsRemaining = 6;
let hintActive = false;

const generateColorBtn = document.getElementById("generateColorBtn");
const hintBtn = document.getElementById("hintBtn");
const hintCount = document.getElementById("hintCount");

const targetColorBox = document.getElementById("targetColor");
const userColorBox = document.getElementById("userColor");

const redSlider = document.getElementById("redSlider");
const greenSlider = document.getElementById("greenSlider");
const blueSlider = document.getElementById("blueSlider");

const redValue = document.getElementById("redValue");
const greenValue = document.getElementById("greenValue");
const blueValue = document.getElementById("blueValue");

const redFeedback = document.getElementById("redFeedback");
const greenFeedback = document.getElementById("greenFeedback");
const blueFeedback = document.getElementById("blueFeedback");

const submitBtn = document.getElementById("submitBtn");
const completionMessage = document.getElementById("completionMessage");

// Generate random color
generateColorBtn.addEventListener("click", () => {
    targetRGB = {
        r: Math.floor(Math.random() * 256),
        g: Math.floor(Math.random() * 256),
        b: Math.floor(Math.random() * 256)
    };

    targetColorBox.style.backgroundColor =
        `rgb(${targetRGB.r}, ${targetRGB.g}, ${targetRGB.b})`;

    enableSliders();
    resetUserColor();
    resetHints();
    hideFeedback();
});

// Enable sliders and hint button
function enableSliders() {
    redSlider.disabled = false;
    greenSlider.disabled = false;
    blueSlider.disabled = false;
    hintBtn.disabled = false;
}

// Reset hints
function resetHints() {
    hintsRemaining = 6;
    hintActive = false;
    hintCount.textContent = "6 remaining";
    hintBtn.disabled = false;
}

// Update user color
function updateUserColor() {
    if (!targetRGB) return;

    const r = parseInt(redSlider.value);
    const g = parseInt(greenSlider.value);
    const b = parseInt(blueSlider.value);

    redValue.textContent = r;
    greenValue.textContent = g;
    blueValue.textContent = b;

    userColorBox.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;

    if (hintActive) {
        hideFeedback();
        hintActive = false;
    }

    checkMatch(r, g, b);
}

redSlider.addEventListener("input", updateUserColor);
greenSlider.addEventListener("input", updateUserColor);
blueSlider.addEventListener("input", updateUserColor);

// Hint button
hintBtn.addEventListener("click", () => {
    if (hintsRemaining <= 0 || !targetRGB) return;

    showFeedback();
    hintActive = true;
    hintsRemaining--;

    hintCount.textContent = `${hintsRemaining} remaining`;

    if (hintsRemaining === 0) {
        hintBtn.disabled = true;
    }
});

// Show feedback
function showFeedback() {
    const r = parseInt(redSlider.value);
    const g = parseInt(greenSlider.value);
    const b = parseInt(blueSlider.value);

    setFeedback(redFeedback, r, targetRGB.r);
    setFeedback(greenFeedback, g, targetRGB.g);
    setFeedback(blueFeedback, b, targetRGB.b);

    redFeedback.style.display = "block";
    greenFeedback.style.display = "block";
    blueFeedback.style.display = "block";
}

// Hide feedback
function hideFeedback() {
    redFeedback.style.display = "none";
    greenFeedback.style.display = "none";
    blueFeedback.style.display = "none";
}

// Feedback logic
function setFeedback(element, current, target) {
    element.className = "feedback";

    if (current < target) {
        element.textContent = "More";
        element.classList.add("more");
    } else if (current > target) {
        element.textContent = "Less";
        element.classList.add("less");
    } else {
        element.textContent = "Perfect";
        element.classList.add("perfect");
    }
}

// Check if colors match
function checkMatch(r, g, b) {
    submitBtn.disabled = !(
        r === targetRGB.r &&
        g === targetRGB.g &&
        b === targetRGB.b
    );
}

// Reset user controls
function resetUserColor() {
    redSlider.value = 0;
    greenSlider.value = 0;
    blueSlider.value = 0;

    redValue.textContent = 0;
    greenValue.textContent = 0;
    blueValue.textContent = 0;

    userColorBox.style.backgroundColor = "rgb(0, 0, 0)";
    submitBtn.disabled = true;
}

// Submit
submitBtn.addEventListener("click", () => {
    completionMessage.style.display = "block";
});
</script>
</body>
</html>
