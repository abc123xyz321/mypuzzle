<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timing Authentication</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    background-color: #fff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    text-align: center;
}

button {
    padding: 15px 25px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 10px 5px;
    background-color: #007BFF;
    color: white;
    transition: background-color 0.2s;
}

button:hover {
    background-color: #0056b3;
}

button:disabled {
    opacity: 0.6;
    cursor: default;
}

.submit-btn {
    background-color: #28a745;
}

.submit-btn:hover {
    background-color: #218838;
}

#generatedValue,
#stopwatch {
    font-size: 22px;
    font-weight: bold;
    margin: 15px 0;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

/* Switch styling */
.switch {
    position: relative;
    display: inline-block;
    width: 52px;
    height: 28px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.switch input:disabled + .slider {
    opacity: 0.5;
    cursor: default;
}

.slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    transition: 0.2s;
    border-radius: 28px;
}

.slider:before {
    position: absolute;
    content: "";
    height: 22px;
    width: 22px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: 0.2s;
    border-radius: 50%;
}

input:checked + .slider {
    background-color: #007BFF;
}

input:checked + .slider:before {
    transform: translateX(24px);
}

.switch-label {
    font-size: 14px;
    margin-top: 4px;
}

#completionMessage {
    display: none;
    margin-top: 20px;
    font-size: 16px;
    font-family: 'Courier New', monospace;
}
</style>
</head>

<body>
<div class="container">
    <h1>Authentication</h1>

    <button id="generateBtn">Generate Value</button>
    <div id="generatedValue">Target: --.--</div>

    <div class="controls">
        <button id="toggleTimerBtn" disabled>Start</button>

        <div>
            <label class="switch">
                <input type="checkbox" id="rewindSwitch" disabled>
                <span class="slider"></span>
            </label>
            <div class="switch-label">Rewind</div>
        </div>
    </div>

    <div id="stopwatch">0.00</div>

    <button id="submitBtn" class="submit-btn" disabled>Submit</button>

    <p id="completionMessage">magentabook74</p>
</div>

<script>
let targetValue = null;
let timerInterval = null;
let elapsed = 0;
let running = false;
let rewind = false;

const generateBtn = document.getElementById("generateBtn");
const toggleTimerBtn = document.getElementById("toggleTimerBtn");
const rewindSwitch = document.getElementById("rewindSwitch");
const stopwatchDisplay = document.getElementById("stopwatch");
const generatedValueDisplay = document.getElementById("generatedValue");
const submitBtn = document.getElementById("submitBtn");
const completionMessage = document.getElementById("completionMessage");

// Generate random value between 5.00 and 30.00
generateBtn.addEventListener("click", () => {
    targetValue = (Math.random() * (30 - 5) + 5).toFixed(2);
    generatedValueDisplay.textContent = `Target: ${targetValue}`;

    resetStopwatch();

    toggleTimerBtn.disabled = false;
    rewindSwitch.disabled = false;
});

// Start / Stop stopwatch
toggleTimerBtn.addEventListener("click", () => {
    if (!running) {
        timerInterval = setInterval(updateStopwatch, 10);
        toggleTimerBtn.textContent = "Stop";
        running = true;
    } else {
        clearInterval(timerInterval);
        running = false;
        toggleTimerBtn.textContent = "Start";
        checkMatch();
    }
});

// Rewind switch
rewindSwitch.addEventListener("change", () => {
    rewind = rewindSwitch.checked;
});

// Stopwatch update
function updateStopwatch() {
    if (rewind) {
        elapsed -= 10;
        if (elapsed < 0) elapsed = 0;
    } else {
        elapsed += 10;
    }

    stopwatchDisplay.textContent = (elapsed / 1000).toFixed(2);
}

// Match check
function checkMatch() {
    if (!targetValue) return;

    const currentTime = parseFloat(stopwatchDisplay.textContent);
    const targetTime = parseFloat(targetValue);

    submitBtn.disabled = currentTime !== targetTime;
}

// Reset
function resetStopwatch() {
    clearInterval(timerInterval);
    elapsed = 0;
    running = false;
    rewind = false;

    stopwatchDisplay.textContent = "0.00";
    toggleTimerBtn.textContent = "Start";
    rewindSwitch.checked = false;
    submitBtn.disabled = true;
}

// Submit
submitBtn.addEventListener("click", () => {
    completionMessage.style.display = "block";
});
</script>
</body>
</html>
